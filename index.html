<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Aifate HUB — Priority Field Final Demo Mobile</title>
<style>
:root{
  --bg:#071018;
  --panel:rgba(11,22,34,.72);
  --line:rgba(255,255,255,.10);
  --text:#ecf6ff;
  --muted:#8ea5b8;
  --ok:#59d98e;
  --warn:#ffd86a;
  --danger:#ff677b;
  --core:#7ce9ff;
  --shadow: 0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;background:
radial-gradient(circle at 50% 22%, rgba(54,126,184,.14), transparent 34%),
linear-gradient(180deg,#071018 0%,#04090e 100%);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:14px 16px 8px;position:relative;z-index:20
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:34px;height:34px;border:1px solid rgba(124,233,255,.55);border-radius:50%;
 display:grid;place-items:center;box-shadow:0 0 24px rgba(124,233,255,.18) inset,0 0 18px rgba(124,233,255,.14)
}
.logo:before{content:"A";font-weight:700;letter-spacing:-1px}
.brandtxt strong{display:block;font-size:14px;letter-spacing:.08em}
.brandtxt span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.live{display:flex;align-items:center;gap:7px;color:#a9bbca;font-size:11px}
.live i{width:7px;height:7px;background:var(--ok);border-radius:50%;box-shadow:0 0 12px rgba(89,217,142,.8)}
#stage{position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.vignette{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(circle at center,transparent 44%,rgba(0,0,0,.25) 100%)}
.hud{
 position:absolute;left:12px;right:12px;top:8px;display:flex;justify-content:space-between;
 align-items:flex-start;pointer-events:none;z-index:10
}
.priority{
 max-width:min(74vw,460px);background:rgba(8,18,29,.58);backdrop-filter:blur(12px);
 border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)
}
.priority .kicker{font-size:9px;color:#8da4b6;letter-spacing:.18em;text-transform:uppercase}
.priority .title{font-size:14px;font-weight:700;margin-top:3px;line-height:1.4}
.priority .meta{font-size:10px;color:#9db1c1;margin-top:3px}
.pulse-note{
 margin-top:7px;display:inline-flex;gap:6px;align-items:center;font-size:10px;color:#c8d8e4
}
.pulse-note b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);box-shadow:0 0 12px rgba(255,103,123,.8)}
.legend{
 margin-top:4px;padding:8px 9px;border-radius:12px;background:rgba(8,18,29,.46);
 border:1px solid var(--line);backdrop-filter:blur(10px);font-size:9px;color:#9fb2c1
}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.sw{width:7px;height:7px;border-radius:50%}
.sw.ok{background:var(--ok)} .sw.warn{background:var(--warn)} .sw.danger{background:var(--danger)}
#detail{
 position:absolute;left:12px;right:12px;bottom:10px;z-index:25;
 background:rgba(8,18,29,.86);border:1px solid rgba(255,255,255,.13);border-radius:16px;
 padding:12px 13px 13px;backdrop-filter:blur(18px);box-shadow:var(--shadow);
 transform:translateY(calc(100% + 24px));opacity:0;transition:.25s ease;pointer-events:none
}
#detail.show{transform:translateY(0);opacity:1;pointer-events:auto}
#detail .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
#detail h3{font-size:14px;margin:0}
#detail .close{border:0;background:rgba(255,255,255,.07);color:#d6e2eb;border-radius:50%;width:28px;height:28px}
#detail p{font-size:11px;line-height:1.55;color:#9fb2c1;margin:6px 0 0}
#detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:9px;padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07)}
#detail .list{margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:7px}
#detail .row{display:grid;grid-template-columns:72px 1fr;gap:9px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:10px}
#detail .row:last-child{border-bottom:0}
#detail .key{color:#7891a5}
#detail .val{color:#e4f0f7;font-weight:600;min-width:0;overflow-wrap:anywhere}
#detail .action{margin-top:10px;width:100%;border:1px solid rgba(124,233,255,.38);background:rgba(124,233,255,.09);color:#dffaff;border-radius:11px;padding:9px 10px;font-weight:650}
footer{
 display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 overflow:auto;position:relative;z-index:40;background:linear-gradient(180deg,rgba(4,9,14,0),rgba(4,9,14,.92) 26%)
}
footer button{
 flex:0 0 auto;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);
 color:#b9c9d6;border-radius:999px;padding:9px 12px;font-size:10px;min-height:40px;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation
}
footer button.active{color:#eafcff;border-color:rgba(124,233,255,.45);background:rgba(124,233,255,.10)}

@media(max-width:640px){
 header{padding:10px 12px 6px}
 .brand{gap:8px}
 .logo{width:30px;height:30px}
 .brandtxt strong{font-size:12px}
 .brandtxt span{font-size:8px}
 .live{font-size:9px}
 .legend{display:none}
 .hud{left:8px;right:8px;top:5px}
 .priority{max-width:calc(100vw - 16px);padding:8px 10px;border-radius:12px}
 .priority .kicker{font-size:8px}
 .priority .title{font-size:12px;line-height:1.35}
 .priority .meta{font-size:9px}
 .pulse-note{font-size:9px;margin-top:5px}
 #detail{left:8px;right:8px;bottom:8px;border-radius:14px;max-height:58%;overflow:auto;-webkit-overflow-scrolling:touch}
 #detail h3{font-size:13px}
 #detail p{font-size:10px}
 #detail .row{grid-template-columns:64px 1fr;font-size:10px}
 footer{gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));scrollbar-width:none}
 footer::-webkit-scrollbar{display:none}
 footer button{padding:9px 12px;font-size:10px;min-height:40px}
}
@media(max-width:380px){
 .brandtxt span{display:none}
 .priority .meta{display:none}
 .priority{max-width:calc(100vw - 16px)}
 footer button{padding:9px 10px}
}
@media (orientation:landscape){
  header{padding:7px 12px 4px}
  .logo{width:28px;height:28px}
  .brandtxt strong{font-size:11px}
  .brandtxt span{font-size:8px}
  #stage{overflow:hidden}
  .hud{left:8px;right:8px;top:6px}
  .priority{max-width:310px;padding:7px 9px;border-radius:11px}
  .priority .kicker{font-size:7px}
  .priority .title{font-size:11px;line-height:1.25}
  .priority .meta{font-size:8px;margin-top:2px}
  .pulse-note{font-size:8px;margin-top:4px}
  .legend{display:none}
  #detail{
    left:8px;right:auto;top:8px;bottom:8px;
    width:min(430px,42vw);max-height:none;
    overflow:auto;-webkit-overflow-scrolling:touch
  }
  #detail .list{padding-bottom:4px}
  #detail .row{grid-template-columns:54px 1fr;gap:7px;padding:5px 0;font-size:9px}
  #detail .tags{margin-top:7px}
  footer{justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  footer button{min-height:36px;padding:7px 11px;font-size:9px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <div class="logo"></div>
    <div class="brandtxt"><strong>AIFATE HUB</strong><span>PRIORITY FIELD / LIVE OPERATIONS</span></div>
  </div>
  <div class="live"><i></i><span>LIVE</span></div>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="priority">
      <div class="kicker">Priority Core</div>
      <div class="title" id="priorityTitle">Twinow：決済エラーを最優先で確認</div>
      <div class="meta" id="priorityMeta">影響範囲：店舗ポータル / 決済フロー</div>
      <div class="pulse-note" id="priorityPulse" style="display:inline-flex"><b></b><span>人間判断が必要</span></div>
    </div>
    <div class="legend">
      <div><span class="sw ok"></span>正常</div>
      <div><span class="sw warn"></span>注意</div>
      <div><span class="sw danger"></span>優先対応</div>
    </div>
  </div>

  <div id="detail">
    <div class="top"><h3 id="detailTitle"></h3><button class="close" id="closeDetail">×</button></div>
    <p id="detailText"></p>
    <div class="tags" id="detailTags"></div>
    <div class="list" id="detailList"></div>
    <button class="action" id="detailAction">この項目を開く</button>
  </div>
</div>

<footer>
  <button id="refreshBtn" class="refresh" aria-label="最新情報に更新" title="最新情報に更新">↻</button>
  <button data-mode="twinowCritical">重大</button>
  <button data-mode="workerFail">停止</button>
  <button data-mode="foundiaWarn">警告</button>
</footer>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const media = [
  {id:'twinow', label:'Twinow', color:'#63d8ff', angle:-0.85},
  {id:'foundia', label:'Foundia', color:'#b99cff', angle:0.1},
  {id:'carwhip', label:'carwhip', color:'#ffb06a', angle:0.95},
  {id:'crypto', label:'crypto-jp', color:'#ffe36d', angle:2.0},
  {id:'smap', label:'smaphomeister', color:'#74e3a5', angle:2.8},
  {id:'aitrades', label:'ai-trades', color:'#ff8ecf', angle:-2.35}
];

const jobsBase = [
  {id:'t_access', media:'twinow', status:'critical', baseSeverity:2, severity:0, count:2, label:'店舗ページ閲覧障害', desc:'公開済み店舗ページの一部で閲覧エラーを検知。送客導線に影響しています。'},
  {id:'t_reco', media:'twinow', status:'warning', baseSeverity:1, severity:0, count:4, label:'レコメンド遅延', desc:'周辺レコメンドの応答時間が基準値を超過しています。'},

  {id:'f_image_worker', media:'foundia', status:'stop', baseSeverity:2, severity:0, count:1, label:'画像生成Worker停止', desc:'記事画像生成Workerが停止し、新規記事の画像生成が進んでいません。'},
  {id:'f_ga4', media:'foundia', status:'warning', baseSeverity:1, severity:0, count:1, label:'GA4流入急減', desc:'直近平均に対して流入が急減。計測異常または流入低下の確認が必要です。'},

  {id:'c_cta', media:'carwhip', status:'critical', baseSeverity:2, severity:0, count:3, label:'CTAリンク切れ', desc:'主要記事のCTAリンク切れを検知。収益導線に影響しています。'},
  {id:'c_ctr', media:'carwhip', status:'warning', baseSeverity:1, severity:0, count:5, label:'CTR急低下', desc:'検索流入上位記事のCTRが基準値を下回っています。'},

  {id:'cr_scheduler', media:'crypto', status:'stop', baseSeverity:2, severity:0, count:1, label:'更新Scheduler停止', desc:'記事自動生成・更新Schedulerが停止しています。'},
  {id:'cr_data', media:'crypto', status:'warning', baseSeverity:1, severity:0, count:2, label:'参照データ更新遅延', desc:'外部参照データの更新時刻が許容範囲を超えています。'},

  {id:'s_cta', media:'smap', status:'critical', baseSeverity:2, severity:0, count:2, label:'送客CTA遷移障害', desc:'問い合わせ・送客CTAの一部で正常に遷移しない状態を検知。'},
  {id:'s_bounce', media:'smap', status:'warning', baseSeverity:1, severity:0, count:2, label:'LP離脱率急上昇', desc:'主要LPの離脱率が直近平均を大きく上回っています。'},

  {id:'a_queue', media:'aitrades', status:'stop', baseSeverity:2, severity:0, count:1, label:'記事生成Queue停止', desc:'AI記事生成Jobが連続失敗しQueue処理が停止しています。'},
  {id:'a_check', media:'aitrades', status:'warning', baseSeverity:1, severity:0, count:3, label:'AI Check失敗率上昇', desc:'公開前AI Checkの失敗率が基準値を超えています。'}
];

let jobs = jobsBase.map(x=>({...x}));
let nodes = [];
let W=0,H=0,cx=0,cy=0,mode='mixed',last=performance.now();
let selected=null;
let priorityCount=3;

function isLandscape(){
  return W>H*1.35;
}
function resize(){
  const r=stage.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(isLandscape()){
    // 左にPriority説明領域を残し、Field本体を右側へ展開。
    cx=W*0.64; cy=H*0.55;
  }else{
    cx=W/2; cy=H*0.53;
  }
  rebuild();
  if(nodes.some(n=>n.type==='job' && (n.severity||0)>0)) snapActivePriorityNodes();
}
window.addEventListener('resize',resize);

function mediaPos(m){
  if(isLandscape()){
    const rx=Math.min(W*.255,285);
    const ry=Math.min(H*.31,118);
    return {x:cx+Math.cos(m.angle)*rx, y:cy+Math.sin(m.angle)*ry};
  }
  // 縦向きは媒体の重力圏をCoreから一段外側へ。
  const rad = Math.min(W,H) * (W<500 ? .40 : .38);
  const yScale = W<500 ? .90 : .82;
  return {x:cx+Math.cos(m.angle)*rad, y:cy+Math.sin(m.angle)*rad*yScale};
}
function rebuild(){
  const old = new Map(nodes.map(n=>[n.id,n]));
  nodes = [];
  media.forEach(m=>{
    const p=mediaPos(m);
    nodes.push({...m,type:'media',x:old.get(m.id)?.x??p.x,y:old.get(m.id)?.y??p.y,vx:0,vy:0,tx:p.x,ty:p.y,r:isLandscape()?24:(W<500?26:31)});
  });
  jobs.filter(j=>(j.severity||0)>0).forEach((j,i)=>{
    let tx,ty;
    if(j.media==='system'){
      tx=cx;ty=cy+Math.min(W,H)*.22;
    }else{
      const m=media.find(x=>x.id===j.media), p=mediaPos(m);
      const siblings=jobs.filter(x=>x.media===j.media);
      const localIndex=siblings.findIndex(x=>x.id===j.id);
      const spread=(localIndex-(siblings.length-1)/2)*0.72;
      const orbit=isLandscape()?46:(W<500?50:54);
      const a=m.angle+Math.PI/2+spread;
      tx=p.x+Math.cos(a)*orbit;
      ty=p.y+Math.sin(a)*orbit;
    }
    const o=old.get(j.id);
    nodes.push({...j,type:'job',x:o?.x??tx+(Math.random()-.5)*12,y:o?.y??ty+(Math.random()-.5)*12,vx:o?.vx??0,vy:o?.vy??0,tx,ty,r:9+Math.min(j.count,4)*2.3});
  });
}

function setMode(next){
  mode=next;
  jobs=jobsBase.map(x=>({...x,severity:0}));

  let title='';
  let meta='';
  let human=false;
  let activeIds=[];

  if(next==='twinowCritical'){
    activeIds=jobs.filter(j=>j.status==='critical').map(j=>j.id);
    title='重大 3件を優先確認';
    meta='Twinow / carwhip / smaphomeister';
    human=true;
  }else if(next==='workerFail'){
    activeIds=jobs.filter(j=>j.status==='stop').map(j=>j.id);
    title='停止 3件を優先確認';
    meta='Foundia / crypto-jp / ai-trades';
    human=true;
  }else if(next==='foundiaWarn'){
    activeIds=jobs.filter(j=>j.status==='warning').map(j=>j.id);
    title='警告 6件を確認';
    meta='6媒体で異常値・遅延を検知';
  }else if(next==='mixed'){
    activeIds=jobs.map(j=>j.id);
    const criticalCount=jobs.filter(j=>j.status==='critical').length;
    const stopCount=jobs.filter(j=>j.status==='stop').length;
    const warningCount=jobs.filter(j=>j.status==='warning').length;
    title=`Aifate全体：${jobs.length}件の要対応を優先確認`;
    meta=`重大 ${criticalCount}件 / 停止 ${stopCount}件 / 警告 ${warningCount}件`;
    human=true;
  }

  jobs.forEach(j=>{
    if(activeIds.includes(j.id)) j.severity=j.baseSeverity;
  });

  priorityCount=jobs.filter(j=>(j.severity||0)>0).length;
  document.getElementById('priorityTitle').textContent=title;
  document.getElementById('priorityMeta').textContent=meta;
  document.getElementById('priorityPulse').style.display=human?'inline-flex':'none';
  document.querySelectorAll('footer button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));
  document.getElementById('detail').classList.remove('show');
  rebuild();
  snapActivePriorityNodes();
}
document.querySelectorAll('footer button[data-mode]').forEach(b=>{
  b.addEventListener('click',()=>setMode(b.dataset.mode));
  b.addEventListener('touchend',e=>{e.preventDefault();setMode(b.dataset.mode);},{passive:false});
});
document.getElementById('refreshBtn').addEventListener('click',()=>{
  const u=new URL(window.location.href);
  u.searchParams.set('refresh',Date.now().toString());
  window.location.replace(u.toString());
});
document.getElementById('refreshBtn').addEventListener('touchend',e=>{
  e.preventDefault();
  const u=new URL(window.location.href);
  u.searchParams.set('refresh',Date.now().toString());
  window.location.replace(u.toString());
},{passive:false});

function severityColor(s){return s===2?'#ff677b':s===1?'#ffd86a':'#59d98e'}

function coreVisualRadius(){
  return isLandscape()
    ? Math.min(W*.055,H*.18)
    : Math.min(W,H)*(W<500?.105:.09);
}

function jobVisualOuterRadius(n){
  const s=n.severity||0;
  const scale=s===2?1.35:s===1?1.12:1;
  // 重大/停止はパルス外周の最大値まで含めて判定。
  const pulseMax=s===2?1.09:1;
  const outerRing=s===2?8:2;
  return (n.r||10)*scale*pulseMax + outerRing;
}

function priorityOuterGap(n){
  // Core外周とノード外周の見た目の距離。
  if(n.status==='warning') return 25;
  if(n.status==='stop') return 8;
  return 4; // 重大
}

function priorityDistance(n){
  return coreVisualRadius() + jobVisualOuterRadius(n) + priorityOuterGap(n);
}

function snapActivePriorityNodes(){
  const active=nodes.filter(n=>n.type==='job' && (n.severity||0)>0);
  active.forEach(n=>{
    const dist=priorityDistance(n);
    if(n.media==='system'){
      n.x=cx;
      n.y=cy+dist;
    }else{
      const m=media.find(x=>x.id===n.media);
      const mp=mediaPos(m);
      const dx=mp.x-cx, dy=mp.y-cy;
      const d=Math.hypot(dx,dy)||1;
      n.x=cx + dx/d*dist;
      n.y=cy + dy/d*dist;
    }
    n.vx=0;
    n.vy=0;
  });

  // Immediate small relaxation so same-ring items do not start overlapped.
  for(let pass=0;pass<8;pass++){
    for(let i=0;i<active.length;i++){
      for(let j=i+1;j<active.length;j++){
        const a=active[i], b=active[j];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
        const min=jobVisualOuterRadius(a)+jobVisualOuterRadius(b)+14;
        if(d<min){
          const overlap=min-d;
          const ux=dx/d, uy=dy/d;
          a.x-=ux*overlap*.5; a.y-=uy*overlap*.5;
          b.x+=ux*overlap*.5; b.y+=uy*overlap*.5;
        }
      }
    }
  }
}

function update(dt){
  for(const n of nodes){
    let tx=n.tx, ty=n.ty;

    if(n.type==='job' && (n.severity||0)>0){
      const dist=priorityDistance(n);

      if(n.media==='system'){
        tx=cx;
        ty=cy+dist;
      }else{
        const m=media.find(x=>x.id===n.media);
        const mp=mediaPos(m);
        const dx=mp.x-cx, dy=mp.y-cy;
        const d=Math.hypot(dx,dy)||1;
        tx=cx + dx/d*dist;
        ty=cy + dy/d*dist;
      }
    }

    const k=n.type==='media'?.010:.060;
    n.vx += (tx-n.x)*k*dt;
    n.vy += (ty-n.y)*k*dt;

    if(n.type==='job' && n.status==='warning'){
      const t=performance.now()/1000;
      n.vx += Math.sin(t*.45 + hash(n.id))*.0010*dt;
      n.vy += Math.cos(t*.38 + hash(n.id)*.7)*.0010*dt;
    }

    n.vx*=Math.pow(.74,dt);
    n.vy*=Math.pow(.74,dt);
    n.x+=n.vx*dt;
    n.y+=n.vy*dt;

    if(n.type==='job' && (n.severity||0)>0){
      const dx=n.x-cx, dy=n.y-cy, d=Math.hypot(dx,dy)||1;
      const dist=priorityDistance(n);
      const safe=dist;
      if(d<safe){
        const push=(safe-d)/d;
        n.x+=dx*push;
        n.y+=dy*push;
        n.vx*=.45;
        n.vy*=.45;
      }
    }
  }

  // Keep media fields as anchors and push issue nodes away from overlaps.
  const passes=isLandscape()?6:5;
  for(let pass=0;pass<passes;pass++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
        const hasMedia=a.type==='media' || b.type==='media';
        const bothJobs=a.type==='job' && b.type==='job';
        const gap=hasMedia?18:(bothJobs?16:10);
        const collisionRadius=x=>{
          if(x.type==='media') return (x.r||10)+6;
          if(x.type==='job' && (x.severity||0)>0) return jobVisualOuterRadius(x);
          return x.r||10;
        };
        const min=collisionRadius(a)+collisionRadius(b)+gap;

        if(d<min){
          const overlap=min-d;
          const ux=dx/d, uy=dy/d;

          if(a.type==='media' && b.type==='job'){
            b.x+=ux*overlap*.96; b.y+=uy*overlap*.96;
            a.x-=ux*overlap*.04; a.y-=uy*overlap*.04;
          }else if(b.type==='media' && a.type==='job'){
            a.x-=ux*overlap*.96; a.y-=uy*overlap*.96;
            b.x+=ux*overlap*.04; b.y+=uy*overlap*.04;
          }else{
            a.x-=ux*overlap*.50; a.y-=uy*overlap*.50;
            b.x+=ux*overlap*.50; b.y+=uy*overlap*.50;
          }

          a.vx*=.40; a.vy*=.40;
          b.vx*=.40; b.vy*=.40;
        }
      }
    }
  }
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h)}

function roundRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function textWidth(t,font){ctx.save();ctx.font=font;const w=ctx.measureText(t).width;ctx.restore();return w}

function draw(){
  ctx.clearRect(0,0,W,H);
  // grid / field
  ctx.save();
  ctx.globalAlpha=.09;ctx.strokeStyle='#8bcfff';ctx.lineWidth=.5;
  const step=42;
  for(let x=(cx%step);x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=(cy%step);y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();

  // media bonds
  media.forEach(m=>{
    const mn=nodes.find(n=>n.id===m.id);
    ctx.save();ctx.strokeStyle=hexAlpha(m.color,.16);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(mn.x,mn.y);ctx.stroke();ctx.restore();
  });

  // core rings
  const t=performance.now()/1000;
  const base=isLandscape()?Math.min(W*.055,H*.18):Math.min(W,H)*(W<500?.105:.09);
  for(let i=0;i<3;i++){
    ctx.save();
    ctx.strokeStyle=`rgba(124,233,255,${.18-i*.045})`;
    ctx.lineWidth=1;
    ctx.setLineDash([4+i*2,8+i*3]);
    ctx.translate(cx,cy);ctx.rotate((i%2?1:-1)*t*.03*(i+1));
    ctx.beginPath();ctx.arc(0,0,base+i*15,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,base*1.2);
  grad.addColorStop(0,'rgba(124,233,255,.13)');grad.addColorStop(1,'rgba(124,233,255,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,base*1.3,0,Math.PI*2);ctx.fill();

  // nodes
  const order=[...nodes].sort((a,b)=>(a.severity||0)-(b.severity||0));
  for(const n of order){
    if(n.type==='media') drawMedia(n);
    else drawJob(n);
  }

  // Keep the central count above every node on mobile and desktop.
  drawCoreText();
}
function drawCoreText(){
  ctx.save();
  ctx.textAlign='center';
  ctx.shadowColor='rgba(4,9,14,.95)';ctx.shadowBlur=7;
  ctx.fillStyle='#f2fcff';ctx.font=`800 ${W<430?28:32}px -apple-system, sans-serif`;ctx.fillText(String(priorityCount),cx,cy+2);
  ctx.shadowBlur=4;
  ctx.fillStyle='#8fb4c7';ctx.font='700 8px -apple-system, sans-serif';ctx.fillText('PRIORITY CORE',cx,cy+18);
  ctx.fillStyle='#6f8da0';ctx.font='8px -apple-system, sans-serif';ctx.fillText('要対応',cx,cy+29);
  ctx.restore();
}
function drawMedia(n){
  const p=performance.now()/1000;
  ctx.save();
  const g=ctx.createRadialGradient(n.x,n.y,1,n.x,n.y,n.r*1.9);
  g.addColorStop(0,hexAlpha(n.color,.18));g.addColorStop(1,hexAlpha(n.color,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r*1.9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hexAlpha(n.color,.50);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=hexAlpha(n.color,.16);ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(n.x,n.y,n.r+6,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#dcebf5';ctx.font=`600 ${W<430?10:10}px -apple-system, sans-serif`;ctx.textAlign='center';
  ctx.fillText(n.label,n.x,n.y+3);
  ctx.restore();
}
function drawJob(n){
  const s=n.severity||0, col=severityColor(s);
  const pulse=s===2 ? 1+Math.sin(performance.now()/230)*.09 : 1;
  const r=n.r*(s===2?1.35:s===1?1.12:1)*pulse;

  if(n.media!=='system' && s>0){
    const m=nodes.find(x=>x.id===n.media);
    // 因子→媒体の線は、媒体→Priority Coreと同じ太さ・媒体色・不透明度に統一。
    ctx.save();ctx.strokeStyle=hexAlpha(m.color,.16);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(n.x,n.y);ctx.stroke();ctx.restore();
  }

  ctx.save();
  if(s>0){
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.5);
    g.addColorStop(0,hexAlpha(col,s===2?.24:.15));g.addColorStop(1,hexAlpha(col,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,r*2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='rgba(8,18,29,.88)';ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hexAlpha(col,s===0?.42:.88);ctx.lineWidth=s===2?1.7:1;ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.stroke();

  if(s===2){
    ctx.strokeStyle=hexAlpha(col,.30);ctx.lineWidth=1;ctx.beginPath();ctx.arc(n.x,n.y,r+6+Math.sin(performance.now()/250)*2,0,Math.PI*2);ctx.stroke();
  }

  const showLabel = s>0 || (W>650 && !isLandscape());
  if(showLabel){
    const font=`${s===2?'700':'600'} ${W<430?9:10}px -apple-system, sans-serif`;
    const tw=textWidth(n.label,font)+14;
    const y=n.y+r+8;
    ctx.fillStyle='rgba(5,12,19,.82)';roundRect(n.x-tw/2,y,tw,20,10);ctx.fill();
    ctx.strokeStyle=hexAlpha(col,.26);ctx.stroke();
    ctx.fillStyle=s===0?'#b8c9d5':'#eef8ff';ctx.font=font;ctx.textAlign='center';ctx.fillText(n.label,n.x,y+13.5);
  }
  ctx.restore();
}
function hexAlpha(hex,a){
  const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function loop(now){
  const dt=Math.min((now-last)/16.67,2);last=now;update(dt);draw();requestAnimationFrame(loop);
}

function activateCanvasPoint(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  const x=clientX-r.left, y=clientY-r.top;

  // Priority Coreは常に最優先のタップ対象。
  // スマホでは見た目より少し広い判定にして、中央数字・リングのどこを押しても開く。
  const coreHitR=isLandscape()?Math.min(W*.085,H*.27):Math.min(W,H)*(W<500?.18:.145);
  if(Math.hypot(x-cx,y-cy)<=coreHitR){
    showCoreDetail();
    return true;
  }

  // Larger touch radius on phones so small moving nodes remain easy to tap.
  const extra=W<640?24:14;
  const hits=nodes
    .map(n=>({n,d:Math.hypot(n.x-x,n.y-y)}))
    .filter(h=>h.d<Math.max((h.n.r||12)+extra,30))
    .sort((a,b)=>{
      const sev=(b.n.severity||0)-(a.n.severity||0);
      return sev!==0?sev:a.d-b.d;
    });
  if(hits.length){
    selected=hits[0].n;
    showDetail(selected);
    return true;
  }
  return false;
}

if(window.PointerEvent){
  canvas.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch') e.preventDefault();
    activateCanvasPoint(e.clientX,e.clientY);
  },{passive:false});
}else{
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches&&e.changedTouches[0];
    if(!t) return;
    e.preventDefault();
    activateCanvasPoint(t.clientX,t.clientY);
  },{passive:false});
  canvas.addEventListener('click',e=>activateCanvasPoint(e.clientX,e.clientY));
}
function showCoreDetail(){
  const priorityJobs=nodes
    .filter(n=>n.type==='job' && (n.severity||0)>0)
    .sort((a,b)=>(b.severity||0)-(a.severity||0));

  selected=null;
  document.getElementById('detailTitle').textContent=`Priority Core — 優先対応 ${priorityJobs.length}件`;
  const detailText=document.getElementById('detailText');
  detailText.textContent='';
  detailText.style.display='none';

  const tags=document.getElementById('detailTags');
  tags.innerHTML='';
  const critical=priorityJobs.filter(n=>n.status==='critical').length;
  const stopped=priorityJobs.filter(n=>n.status==='stop').length;
  const warning=priorityJobs.filter(n=>n.status==='warning').length;
  [
    `合計 ${priorityJobs.length}件`,
    critical?`重大 ${critical}件`:null,
    stopped?`停止 ${stopped}件`:null,
    warning?`警告 ${warning}件`:null
  ].filter(Boolean).forEach(t=>{
    const s=document.createElement('span');
    s.className='tag';
    s.textContent=t;
    tags.appendChild(s);
  });

  const list=document.getElementById('detailList');
  list.innerHTML='';
  priorityJobs.forEach((n,idx)=>{
    const mediaName=n.media==='system'
      ? 'Aifate共通'
      : (media.find(m=>m.id===n.media)?.label||'');
    const r=document.createElement('div');
    r.className='row';
    const key=document.createElement('div');
    key.className='key';
    key.textContent=n.status==='stop'?'停止':(n.status==='critical'?'重大':'警告');
    const val=document.createElement('div');
    val.className='val';
    val.textContent=`${idx+1}. ${mediaName}｜${n.label}｜${n.desc}`;
    r.append(key,val);
    list.appendChild(r);
  });

  document.getElementById('detailAction').textContent='優先項目を確認';
  document.getElementById('detail').classList.add('show');
}

function showDetail(n){
  const isMedia=n.type==='media';
  const detailText=document.getElementById('detailText');
  const tags=document.getElementById('detailTags');
  const list=document.getElementById('detailList');
  tags.innerHTML='';
  list.innerHTML='';

  if(isMedia){
    document.getElementById('detailTitle').textContent=n.label;
    detailText.textContent='';
    detailText.style.display='none';

    const mediaJobs=nodes
      .filter(x=>x.type==='job' && x.media===n.id && (x.severity||0)>0)
      .sort((a,b)=>(b.severity||0)-(a.severity||0) || a.label.localeCompare(b.label,'ja'));

    [`要対応 ${mediaJobs.length}件`]
      .forEach(t=>{
        const s=document.createElement('span');
        s.className='tag';
        s.textContent=t;
        tags.appendChild(s);
      });

    mediaJobs.forEach((job,idx)=>{
      const r=document.createElement('div');r.className='row';
      const key=document.createElement('div');key.className='key';
      key.textContent=job.status==='stop'?'停止':(job.status==='critical'?'重大':'警告');
      const val=document.createElement('div');val.className='val';
      val.textContent=`${idx+1}. ${job.label}｜${job.count||1}件`;
      r.append(key,val);list.appendChild(r);
    });

    if(!mediaJobs.length){
      const r=document.createElement('div');r.className='row';
      const key=document.createElement('div');key.className='key';key.textContent='—';
      const val=document.createElement('div');val.className='val';val.textContent='現在、要対応項目はありません';
      r.append(key,val);list.appendChild(r);
    }

    document.getElementById('detailAction').textContent='媒体を開く';
    document.getElementById('detail').classList.add('show');
    return;
  }

  document.getElementById('detailAction').textContent='この項目を開く';
  detailText.style.display='';
  document.getElementById('detailTitle').textContent=`${n.label} — ${n.media==='system'?'Aifate共通':media.find(m=>m.id===n.media)?.label||''}`;
  detailText.textContent=n.desc;

  const arr=[n.status==='stop'?'停止':(n.status==='critical'?'重大':'警告'),`件数 ${n.count||1}`,n.media==='system'?'媒体横断':'媒体内'];
  arr.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;tags.appendChild(s)});

  const mediaName=n.media==='system'?'Aifate共通':media.find(m=>m.id===n.media)?.label||'';
  const severity=n.status==='stop'?'停止':(n.status==='critical'?'重大':'警告');
  [['重要度',severity],['件数',`${n.count||1}件`],['対象',mediaName],['内容',n.desc]].forEach(([k,v])=>{
    const r=document.createElement('div');r.className='row';
    const key=document.createElement('div');key.className='key';key.textContent=k;
    const val=document.createElement('div');val.className='val';val.textContent=v;
    r.append(key,val);list.appendChild(r);
  });
  document.getElementById('detail').classList.add('show');
}
document.getElementById('closeDetail').onclick=()=>document.getElementById('detail').classList.remove('show');
document.getElementById('closeDetail').addEventListener('touchend',e=>{e.preventDefault();document.getElementById('detail').classList.remove('show')},{passive:false});
document.getElementById('detailAction').onclick=()=>alert('本番では対象画面へ遷移します。デモでは遷移を省略しています。');

resize(); setMode('mixed'); requestAnimationFrame(loop);
</script>
